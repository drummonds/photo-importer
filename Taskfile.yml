version: '3'

tasks:
  fmt:
    desc: Format Go source
    cmds:
      - go fix ./...
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  check:
    desc: fmt + vet + lint + test
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  build:
    desc: Build local binary
    cmds:
      - go build -o photo-importer .

  install:
    desc: Install into $GOBIN
    cmds:
      - go install .

  deps:tidy:
    desc: Tidy modules
    cmds:
      - go mod tidy

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f photo-importer
      - rm -rf dist/
